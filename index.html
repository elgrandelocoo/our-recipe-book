<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#fff8f2">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<meta name="apple-mobile-web-app-title"
content="Our Recipe Book">

<title>Our Recipe Book</title>


<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
}

html {
    background: #fff8f2;
}

body {
    margin: 0;
    min-height: 100dvh;

    background:
        linear-gradient(
            145deg,
            #fffaf7 0%,
            #fff3f0 48%,
            #f3f7ff 100%
        );

    color: #514b4b;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}


/* =====================================================
   APP
===================================================== */

.app {
    min-height: 100dvh;

    padding:
        calc(env(safe-area-inset-top) + 24px)
        18px
        calc(env(safe-area-inset-bottom) + 30px);
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    text-align: center;
    margin-bottom: 22px;
}

.header-icon {
    font-size: 42px;
    margin-bottom: 8px;
}

.title {
    margin: 0;

    font-size: 32px;
    font-weight: 750;

    letter-spacing: -0.6px;

    color: #554c50;
}

.subtitle {
    margin-top: 6px;

    font-size: 12px;

    color: #a59a9e;

    letter-spacing: 1px;
}


/* =====================================================
   LOGIN
===================================================== */

.login-screen {
    min-height: 85dvh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.login-card {
    width: 100%;
    max-width: 400px;

    padding: 28px;

    background:
        rgba(255,255,255,0.82);

    border:
        1px solid
        rgba(150,130,130,0.10);

    border-radius: 26px;

    box-shadow:
        0 15px 45px
        rgba(120,90,90,0.10);

    backdrop-filter: blur(15px);
}

.login-title {
    text-align: center;

    font-size: 23px;
    font-weight: 700;

    margin-bottom: 20px;
}

.input {
    width: 100%;

    padding: 15px;

    margin-bottom: 10px;

    border:
        1px solid
        #e2d9dc;

    border-radius: 15px;

    background: #fff;

    outline: none;

    font-size: 16px;

    color: #554c50;
}

.input:focus {
    border-color: #d3aebb;
}

.primary-button {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 15px;

    background: #e9c8d4;

    color: #58474e;

    font-size: 16px;
    font-weight: 700;
}

.error {
    margin-top: 12px;

    text-align: center;

    color: #c47f86;

    font-size: 13px;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.search {
    flex: 1;
    min-width: 0;

    padding: 14px 16px;

    border:
        1px solid
        #e6dfe0;

    border-radius: 17px;

    background:
        rgba(255,255,255,0.75);

    outline: none;

    font-size: 15px;
}

.sort {
    padding: 14px 10px;

    border:
        1px solid
        #e6dfe0;

    border-radius: 17px;

    background:
        rgba(255,255,255,0.75);

    color: #665d61;

    font-size: 13px;
}


/* =====================================================
   FILTERS
===================================================== */

.filters {
    display: flex;

    gap: 7px;

    overflow-x: auto;

    padding-bottom: 5px;

    margin-bottom: 18px;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter {
    flex-shrink: 0;

    padding:
        10px
        14px;

    border-radius: 15px;

    border:
        1px solid
        #e7dfe2;

    background:
        rgba(255,255,255,0.65);

    color: #9b9095;

    font-size: 12px;
}

.filter.active {
    background: #ead7ee;

    color: #63536a;

    border-color: #d7c2dc;
}


/* =====================================================
   RECIPE GRID
===================================================== */

.recipe-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}


/* =====================================================
   RECIPE CARD
===================================================== */

.recipe-card {
    overflow: hidden;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.82);

    border:
        1px solid
        rgba(150,135,140,0.10);

    box-shadow:
        0 8px 25px
        rgba(110,90,95,0.07);

    cursor: pointer;

    transition:
        transform 0.15s ease;
}

.recipe-card:active {
    transform: scale(0.97);
}

.recipe-image {
    width: 100%;

    aspect-ratio: 1.25;

    object-fit: cover;

    display: block;
}

.no-image {
    width: 100%;

    aspect-ratio: 1.25;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #f7e8eb,
            #e8eff9
        );
}

.recipe-info {
    padding: 13px;
}

.recipe-title {
    font-size: 16px;

    font-weight: 700;

    color: #554d51;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.recipe-category {
    margin-top: 4px;

    font-size: 10px;

    color: #a39a9e;
}

.rating {
    margin-top: 7px;

    font-size: 13px;

    color: #d49a58;
}


/* =====================================================
   ADD BUTTON
===================================================== */

.floating-add {
    position: fixed;

    right: 22px;

    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 22px
        );

    width: 60px;
    height: 60px;

    border: none;

    border-radius: 50%;

    background: #e8c8d7;

    color: #5b4850;

    font-size: 31px;

    box-shadow:
        0 10px 30px
        rgba(120,90,100,0.20);
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        rgba(50,40,45,0.40);

    backdrop-filter:
        blur(8px);

    padding:
        calc(env(safe-area-inset-top) + 12px)
        12px
        calc(env(safe-area-inset-bottom) + 12px);

    overflow-y: auto;
}

.modal.visible {
    display: flex;

    align-items: flex-start;

    justify-content: center;
}


/* =====================================================
   EDIT MODAL
===================================================== */

.modal-card {
    width: 100%;

    max-width: 700px;

    margin-top: 5px;

    background: #fffaf8;

    border-radius: 28px;

    padding: 22px;

    box-shadow:
        0 20px 60px
        rgba(70,50,55,0.22);
}

.modal-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.modal-title {
    font-size: 24px;

    font-weight: 750;
}

.close {
    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: #f0e7e8;

    color: #70666a;

    font-size: 20px;
}


/* =====================================================
   FORM
===================================================== */

.label {
    display: block;

    margin:
        14px
        0
        6px;

    font-size: 11px;

    font-weight: 700;

    color: #968b8f;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.textarea {
    width: 100%;

    min-height: 100px;

    padding: 13px;

    border:
        1px solid
        #e4dcde;

    border-radius: 15px;

    background: #fff;

    resize: vertical;

    outline: none;

    font-size: 15px;

    color: #554d51;
}

.select {
    width: 100%;

    padding: 13px;

    border:
        1px solid
        #e4dcde;

    border-radius: 15px;

    background: #fff;

    color: #554d51;

    font-size: 15px;
}

.form-row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}


/* =====================================================
   PHOTOS
===================================================== */

.photo-preview {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        5px
        0
        10px;
}

.photo-thumb {
    width: 90px;
    height: 90px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 13px;
}

.photo-input {
    width: 100%;

    padding: 12px;

    border:
        1px dashed
        #d8cbd0;

    border-radius: 15px;

    background: #fff;
}


/* =====================================================
   SAVE / DELETE
===================================================== */

.save-button {
    width: 100%;

    margin-top: 20px;

    padding: 16px;

    border: none;

    border-radius: 17px;

    background: #cfe5d9;

    color: #4f6657;

    font-size: 16px;

    font-weight: 750;
}

.delete-button {
    width: 100%;

    margin-top: 8px;

    padding: 13px;

    border: none;

    border-radius: 15px;

    background: #f3dadd;

    color: #925c65;

    font-size: 14px;
}


/* =====================================================
   RECIPE DETAIL
===================================================== */

.detail-card {
    width: 100%;

    max-width: 720px;

    margin-top: 5px;

    padding: 0;

    overflow: hidden;

    background: #fffaf8;

    border-radius: 30px;

    box-shadow:
        0 20px 60px
        rgba(70,50,55,0.25);
}


/* =====================================================
   DETAIL HERO
===================================================== */

.detail-hero {
    position: relative;

    width: 100%;

    background: #eee4e4;
}

.detail-main-photo {
    display: block;

    width: 100%;

    max-height: 390px;

    object-fit: cover;
}

.detail-no-photo {
    height: 180px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 65px;

    background:
        linear-gradient(
            135deg,
            #f7e5e8,
            #e9eef8
        );
}


/* =====================================================
   DETAIL CONTENT
===================================================== */

.detail-body {
    padding: 24px;
}

.detail-top {
    padding-bottom: 18px;

    border-bottom:
        1px solid
        #eadfe1;
}

.detail-title {
    margin: 0;

    font-size: 30px;

    line-height: 1.15;

    font-weight: 800;

    color: #4f474b;

    letter-spacing: -0.5px;
}

.detail-meta {
    display: flex;

    flex-wrap: wrap;

    align-items: center;

    gap: 8px;

    margin-top: 10px;
}

.detail-stars {
    font-size: 17px;

    color: #d49a58;

    letter-spacing: 1px;
}

.detail-rating-number {
    font-size: 13px;

    color: #8f8589;

    font-weight: 600;
}

.detail-category-pill {
    padding:
        6px
        10px;

    border-radius: 12px;

    background: #f0e1eb;

    color: #77616b;

    font-size: 11px;

    font-weight: 650;
}


/* =====================================================
   DETAIL SECTION
===================================================== */

.detail-section {
    margin-top: 22px;
}

.detail-section-header {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 11px;

    color: #81757a;
}

.detail-section-icon {
    font-size: 17px;
}

.detail-section-title {
    font-size: 12px;

    font-weight: 750;

    letter-spacing: 1.4px;

    text-transform: uppercase;
}


/* =====================================================
   INGREDIENTS
===================================================== */

.ingredients-box {
    padding:
        14px
        16px;

    border-radius: 17px;

    background:
        #f8f1ec;

    border:
        1px solid
        #f0e5df;
}

.ingredient-row {
    display: flex;

    align-items: flex-start;

    gap: 10px;

    padding:
        7px
        0;

    font-size: 15px;

    line-height: 1.35;

    color: #5d5558;
}

.ingredient-dot {
    flex-shrink: 0;

    width: 7px;
    height: 7px;

    margin-top: 6px;

    border-radius: 50%;

    background: #d6a8a8;
}


/* =====================================================
   INSTRUCTIONS
===================================================== */

.instruction-list {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.instruction-row {
    display: flex;

    align-items: flex-start;

    gap: 12px;
}

.instruction-number {
    flex-shrink: 0;

    width: 27px;
    height: 27px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #ead9e9;

    color: #735d73;

    font-size: 12px;

    font-weight: 750;
}

.instruction-text {
    padding-top: 4px;

    font-size: 15px;

    line-height: 1.45;

    color: #5d5558;
}


/* =====================================================
   NOTES
===================================================== */

.notes-box {
    padding:
        15px
        16px;

    border-radius: 17px;

    background:
        #fff0f1;

    border:
        1px solid
        #f5dddd;

    white-space: pre-wrap;

    font-size: 15px;

    line-height: 1.5;

    color: #665b5f;
}


/* =====================================================
   DETAIL PHOTOS
===================================================== */

.detail-photo-strip {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding-top: 10px;

    scrollbar-width: none;
}

.detail-photo-strip::-webkit-scrollbar {
    display: none;
}

.detail-small-photo {
    width: 70px;
    height: 70px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 12px;
}


/* =====================================================
   DETAIL ACTIONS
===================================================== */

.detail-actions {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;

    margin-top: 25px;

    padding-top: 18px;

    border-top:
        1px solid
        #eadfe1;
}

.secondary-button {
    padding: 14px;

    border: none;

    border-radius: 15px;

    background: #eee5ea;

    color: #665b60;

    font-weight: 650;

    font-size: 14px;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty {
    text-align: center;

    padding: 65px 20px;

    color: #a79ca0;
}

.empty-icon {
    font-size: 48px;

    margin-bottom: 12px;
}

.loading {
    text-align: center;

    padding: 50px;

    color: #a79ca0;
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 700px) {

    .recipe-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 390px) {

    .recipe-grid {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 8px;
    }

    .recipe-title {
        font-size: 14px;
    }

    .detail-body {
        padding: 20px;
    }

    .detail-title {
        font-size: 27px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div
id="loginScreen"
class="login-screen">

<!-- =====================================================

===================================================== -->

<div
id="mainApp"
style="display:none;">

    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://geshdseudikxkzukdxpm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_athr8mE5QfYz1pzJRZsf1w_zkEJOfwN";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let currentSpace = null;

let recipes = [];

let currentFilter = "All";

let editingRecipeId = null;


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const error =
        document.getElementById("loginError");

    error.textContent = "";


    if (!email || !password) {

        error.textContent =
            "Please enter your email and password.";

        return;
    }


    const {
        data,
        error: loginError
    } =
        await supabaseClient.auth
        .signInWithPassword({
            email,
            password
        });


    if (loginError) {

        error.textContent =
            loginError.message;

        return;
    }


    currentUser =
        data.user;

    await startApp();
}


/* =====================================================
   SESSION
===================================================== */

async function checkSession() {

    const {
        data
    } =
        await supabaseClient.auth
        .getSession();


    if (data.session) {

        currentUser =
            data.session.user;

        await startApp();
    }
}


/* =====================================================
   START
===================================================== */

async function startApp() {

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "mainApp"
    ).style.display = "block";


    await loadSpace();

    await loadRecipes();

    setupRealtime();
}


/* =====================================================
   LOAD SPACE
===================================================== */

async function loadSpace() {

    const {
        data,
        error
    } =
        await supabaseClient
        .from("recipe_space_members")
        .select("space_id")
        .eq(
            "user_id",
            currentUser.id
        );


    if (error) {

        alert(
            "Could not find the shared recipe book:\n\n"
            +
            error.message
        );

        return;
    }


    if (!data || data.length === 0) {

        alert(
            "Your account is not connected to a recipe book yet."
        );

        return;
    }


    currentSpace =
        data[0].space_id;
}


/* =====================================================
   LOAD RECIPES
===================================================== */

async function loadRecipes() {

    if (!currentSpace) return;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("recipes")
        .select("*")
        .eq(
            "space_id",
            currentSpace
        );


    if (error) {

        alert(
            "Could not load recipes:\n\n"
            +
            error.message
        );

        return;
    }


    recipes =
        data || [];


    await attachPhotoUrls();

    renderFilters();

    renderRecipes();
}


/* =====================================================
   LOAD PHOTO URLS
===================================================== */

async function attachPhotoUrls() {

    for (
        const recipe
        of recipes
    ) {

        const {
            data: photos
        } =
            await supabaseClient
            .from("recipe_photos")
            .select("*")
            .eq(
                "recipe_id",
                recipe.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        recipe.photos = [];


        if (
            photos &&
            photos.length
        ) {

            for (
                const photo
                of photos
            ) {

                const {
                    data: signed
                } =
                    await supabaseClient
                    .storage
                    .from("recipe-photos")
                    .createSignedUrl(
                        photo.storage_path,
                        3600
                    );


                if (
                    signed &&
                    signed.signedUrl
                ) {

                    recipe.photos.push({

                        ...photo,

                        url:
                            signed.signedUrl

                    });
                }
            }
        }
    }
}


/* =====================================================
   FILTERS
===================================================== */

function renderFilters() {

    const container =
        document.getElementById(
            "filters"
        );


    const categories = [

        "All",
        "🍝 Pasta",
        "🥩 Meat",
        "🥗 Healthy",
        "🍳 Breakfast",
        "🍰 Dessert",
        "🥘 Other"

    ];


    container.innerHTML = "";


    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "filter";


            if (
                category ===
                currentFilter
            ) {

                button.classList.add(
                    "active"
                );
            }


            button.textContent =
                category;


            button.onclick =
                function() {

                    currentFilter =
                        category;

                    renderFilters();

                    renderRecipes();
                };


            container.appendChild(
                button
            );
        }
    );
}


/* =====================================================
   RENDER RECIPE GRID
===================================================== */

function renderRecipes() {

    const grid =
        document.getElementById(
            "recipeGrid"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const sort =
        document.getElementById(
            "sort"
        ).value;


    let filtered =
        recipes.filter(
            recipe => {

                const matchesSearch =
                    recipe.title
                    .toLowerCase()
                    .includes(search);


                const matchesCategory =
                    currentFilter === "All"
                    ||
                    recipe.category ===
                    currentFilter;


                return (
                    matchesSearch &&
                    matchesCategory
                );
            }
        );


    filtered.sort(
        (a, b) => {

            if (
                sort === "name"
            ) {

                return a.title
                    .localeCompare(
                        b.title
                    );
            }


            if (
                sort === "nameDesc"
            ) {

                return b.title
                    .localeCompare(
                        a.title
                    );
            }


            if (
                sort === "newest"
            ) {

                return new Date(
                    b.created_at
                )
                -
                new Date(
                    a.created_at
                );
            }


            if (
                sort === "oldest"
            ) {

                return new Date(
                    a.created_at
                )
                -
                new Date(
                    b.created_at
                );
            }


            return (
                Number(
                    b.rating || 0
                )
                -
                Number(
                    a.rating || 0
                )
            );
        }
    );


    grid.innerHTML = "";


    if (
        filtered.length === 0
    ) {

        grid.innerHTML = `

            <div
            class="empty"
            style="grid-column:1/-1;">

                <div class="empty-icon">
                    🍳
                </div>

                <div>
                    No recipes found.
                </div>

            </div>

        `;

        return;
    }


    filtered.forEach(
        recipe => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "recipe-card";


            const photo =
                recipe.photos &&
                recipe.photos.length
                ?
                recipe.photos[0].url
                :
                null;


            const stars =
                recipe.rating
                ?
                "⭐".repeat(
                    Math.round(
                        recipe.rating
                    )
                )
                :
                "No rating";


            card.innerHTML = `

                ${
                    photo

                    ?

                    `<img
                    class="recipe-image"
                    src="${photo}"
                    alt="">`

                    :

                    `<div
                    class="no-image">
                        🍽️
                    </div>`
                }

                <div
                class="recipe-info">

                    <div
                    class="recipe-title">

                        ${escapeHtml(
                            recipe.title
                        )}

                    </div>

                    <div
                    class="recipe-category">

                        ${escapeHtml(
                            recipe.category
                        )}

                    </div>

                    <div
                    class="rating">

                        ${stars}

                    </div>

                </div>

            `;


            card.onclick =
                function() {

                    openRecipe(
                        recipe.id
                    );
                };


            grid.appendChild(
                card
            );
        }
    );
}


/* =====================================================
   FORMAT INGREDIENTS
===================================================== */

function formatIngredients(
    text
) {

    if (!text || !text.trim()) {

        return `

            <div class="ingredient-row">

                <span
                style="color:#aaa;">

                    No ingredients added.

                </span>

            </div>

        `;
    }


    const lines =
        text
        .split(/\r?\n/)
        .map(
            line =>
                line.trim()
        )
        .filter(
            line =>
                line.length > 0
        );


    return lines
        .map(
            line => `

                <div
                class="ingredient-row">

                    <span
                    class="ingredient-dot">
                    </span>

                    <span>

                        ${escapeHtml(
                            line
                        )}

                    </span>

                </div>

            `
        )
        .join("");
}


/* =====================================================
   FORMAT INSTRUCTIONS
===================================================== */

function formatInstructions(
    text
) {

    if (!text || !text.trim()) {

        return `

            <div
            style="
                color:#aaa;
                font-size:15px;
            ">

                No instructions added.

            </div>

        `;
    }


    const lines =
        text
        .split(/\r?\n/)
        .map(
            line =>
                line.trim()
        )
        .filter(
            line =>
                line.length > 0
        );


    return lines
        .map(
            (line, index) => `

                <div
                class="instruction-row">

                    <div
                    class="instruction-number">

                        ${index + 1}

                    </div>

                    <div
                    class="instruction-text">

                        ${escapeHtml(
                            line
                        )}

                    </div>

                </div>

            `
        )
        .join("");
}


/* =====================================================
   OPEN RECIPE DETAIL
===================================================== */

function openRecipe(id) {

    const recipe =
        recipes.find(
            r =>
                r.id === id
        );


    if (!recipe) return;


    const stars =
        recipe.rating
        ?
        "⭐".repeat(
            Math.round(
                recipe.rating
            )
        )
        :
        "No rating";


    const ratingNumber =
        recipe.rating
        ?
        Number(
            recipe.rating
        ).toFixed(1)
        :
        "";


    let mainPhoto = "";


    if (
        recipe.photos &&
        recipe.photos.length
    ) {

        mainPhoto = `

            <img
            class="detail-main-photo"
            src="${recipe.photos[0].url}"
            alt="">

        `;
    }


    else {

        mainPhoto = `

            <div
            class="detail-no-photo">

                🍽️

            </div>

        `;
    }


    let photoStrip = "";


    if (
        recipe.photos &&
        recipe.photos.length > 1
    ) {

        photoStrip = `

            <div
            class="detail-photo-strip">

                ${
                    recipe.photos
                    .map(
                        photo => `

                            <img
                            class="detail-small-photo"
                            src="${photo.url}"
                            alt="">

                        `
                    )
                    .join("")
                }

            </div>

        `;
    }


    const notes =
        recipe.notes &&
        recipe.notes.trim()
        ?
        escapeHtml(
            recipe.notes
        )
        :
        "No notes yet.";


    document.getElementById(
        "detailContent"
    ).innerHTML = `


        <!-- HERO PHOTO -->

        <div
        class="detail-hero">

            ${mainPhoto}

        </div>


        <!-- CONTENT -->

        <div
        class="detail-body">


            <!-- TITLE -->

            <div
            class="detail-top">

                <h1
                class="detail-title">

                    ${escapeHtml(
                        recipe.title
                    )}

                </h1>


                <div
                class="detail-meta">

                    <span
                    class="detail-stars">

                        ${stars}

                    </span>


                    ${
                        ratingNumber
                        ?

                        `<span
                        class="detail-rating-number">

                            ${ratingNumber}

                        </span>`

                        :

                        ""
                    }


                    <span
                    class="detail-category-pill">

                        ${escapeHtml(
                            recipe.category
                        )}

                    </span>

                </div>

            </div>


            <!-- INGREDIENTS -->

            <div
            class="detail-section">

                <div
                class="detail-section-header">

                    <span
                    class="detail-section-icon">

                        🥕
                    
                    </span>

                    <span
                    class="detail-section-title">

                        Ingredients

                    </span>

                </div>


                <div
                class="ingredients-box">

                    ${formatIngredients(
                        recipe.ingredients
                    )}

                </div>

            </div>


            <!-- INSTRUCTIONS -->

            <div
            class="detail-section">

                <div
                class="detail-section-header">

                    <span
                    class="detail-section-icon">

                        👨‍🍳

                    </span>

                    <span
                    class="detail-section-title">

                        Instructions

                    </span>

                </div>


                <div
                class="instruction-list">

                    ${formatInstructions(
                        recipe.instructions
                    )}

                </div>

            </div>


            <!-- NOTES -->

            <div
            class="detail-section">

                <div
                class="detail-section-header">

                    <span
                    class="detail-section-icon">

                        ❤️

                    </span>

                    <span
                    class="detail-section-title">

                        Our Notes

                    </span>

                </div>


                <div
                class="notes-box">

                    ${notes}

                </div>

            </div>


            <!-- PHOTOS -->

            ${
                recipe.photos &&
                recipe.photos.length > 1

                ?

                `

                <div
                class="detail-section">

                    <div
                    class="detail-section-header">

                        <span
                        class="detail-section-icon">

                            📸

                        </span>

                        <span
                        class="detail-section-title">

                            Photos

                        </span>

                    </div>


                    ${photoStrip}

                </div>

                `

                :

                ""
            }


            <!-- ACTIONS -->

            <div
            class="detail-actions">

                <button
                class="secondary-button"
                onclick="
                    editRecipe('${recipe.id}')
                ">

                    ✏️ Edit

                </button>


                <button
                class="secondary-button"
                onclick="
                    closeDetailModal()
                ">

                    Done

                </button>

            </div>


        </div>

    `;


    document.getElementById(
        "detailModal"
    ).classList.add(
        "visible"
    );
}

   NEW RECIPE

        "recipeTitle"

        "recipeCategory"

        "🥘 Other";


    document.getElementById(

    ).value = "";


    document.getElementById(
        "recipeIngredients"
    ).value = "";


    document.getElementById(
        "recipeInstructions"
    ).value = "";


    document.getElementById(
        "recipeNotes"
    ).value = "";


    document.getElementById(
        "photoInput"
    ).value = "";


    document.getElementById(

/* =====================================================
   EDIT RECIPE
===================================================== */

function editRecipe(id) {

    const recipe =
        recipes.find(
            r =>
                r.id === id
        );


    if (!recipe) return;


    editingRecipeId =
        id;


    closeDetailModal();


    document.getElementById(
        "editModalTitle"
    ).textContent =
        "Edit Recipe";


    document.getElementById(
        "recipeTitle"
    ).value =
        recipe.title;


    document.getElementById(
        "recipeCategory"
    ).value =
        recipe.category;


    document.getElementById(
        "recipeRating"
    ).value =
        recipe.rating || "";


    document.getElementById(
        "recipeIngredients"
    ).value =
        recipe.ingredients || "";


    document.getElementById(
        "recipeInstructions"
    ).value =
        recipe.instructions || "";


    document.getElementById(
        "recipeNotes"
    ).value =
        recipe.notes || "";


    document.getElementById(
        "photoInput"
    ).value = "";


    renderExistingPhotos(
        recipe
    );


    document.getElementById(
        "deleteRecipeButton"
    ).style.display =
        "block";


    document.getElementById(
        "editModal"
    ).classList.add(
        "visible"
    );
}


/* =====================================================
   EXISTING PHOTOS
===================================================== */

function renderExistingPhotos(
    recipe
) {

    const container =
        document.getElementById(
            "existingPhotos"
        );


    container.innerHTML = "";


    if (
        !recipe.photos ||
        !recipe.photos.length
    ) {

        return;
    }


    recipe.photos.forEach(
        photo => {

            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "photo-thumb";


            img.src =
                photo.url;


            container.appendChild(
                img
            );
        }
    );
}


/* =====================================================
   SAVE RECIPE
===================================================== */

async function saveRecipe() {

    const title =
        document.getElementById(
            "recipeTitle"
        )
        .value
        .trim();


    if (!title) {

        alert(
            "Please enter a recipe name."
        );

        return;
    }


    const recipeData = {

        title,

        ingredients:
            document.getElementById(
                "recipeIngredients"
            ).value,

        instructions:
            document.getElementById(
                "recipeInstructions"
            ).value,

        notes:
            document.getElementById(
                "recipeNotes"
            ).value,

        rating:
            document.getElementById(
                "recipeRating"
            ).value
            ?
            Number(
                document.getElementById(
                    "recipeRating"
                ).value
            )
            :
            null,

        category:
            document.getElementById(
                "recipeCategory"
            ).value,

        updated_by:
            currentUser.id,

        updated_at:
            new Date().toISOString()
    };


    let recipeId;


    /* UPDATE */

    if (editingRecipeId) {

        const {
            error
        } =
            await supabaseClient
            .from("recipes")
            .update(
                recipeData
            )
            .eq(
                "id",
                editingRecipeId
            );


        if (error) {

            alert(
                error.message
            );

            return;
        }


        recipeId =
            editingRecipeId;
    }


    /* CREATE */

    else {

        recipeData.space_id =
            currentSpace;

        recipeData.created_by =
            currentUser.id;


        const {
            data,
            error
        } =
            await supabaseClient
            .from("recipes")
            .insert(
                recipeData
            )
            .select()
            .single();


        if (error) {

            alert(
                error.message
            );

            return;
        }


        recipeId =
            data.id;
    }


    /* PHOTOS */

    const files =
        document.getElementById(
            "photoInput"
        ).files;


    if (
        files &&
        files.length
    ) {

        for (
            const file
            of files
        ) {

            const safeName =
                file.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const path =
                currentSpace
                +
                "/"
                +
                recipeId
                +
                "/"
                +
                Date.now()
                +
                "_"
                +
                safeName;


            const {
                error: uploadError
            } =
                await supabaseClient
                .storage
                .from("recipe-photos")
                .upload(
                    path,
                    file,
                    {
                        upsert: false
                    }
                );


            if (uploadError) {

                alert(
                    "Recipe saved, but a photo could not be uploaded:\n\n"
                    +
                    uploadError.message
                );

                continue;
            }


            const {
                error: photoError
            } =
                await supabaseClient
                .from("recipe_photos")
                .insert({

                    recipe_id:
                        recipeId,

                    space_id:
                        currentSpace,

                    storage_path:
                        path,

                    created_by:
                        currentUser.id
                });


            if (photoError) {

                alert(
                    "Photo uploaded but could not be registered:\n\n"
                    +
                    photoError.message
                );
            }
        }
    }


    closeEditModal();

    await loadRecipes();
}


/* =====================================================
   DELETE RECIPE
===================================================== */

async function deleteCurrentRecipe() {

    if (!editingRecipeId) return;


    const recipe =
        recipes.find(
            r =>
                r.id ===
                editingRecipeId
        );


    if (!recipe) return;


    const confirmed =
        confirm(
            "Delete this recipe?"
        );


    if (!confirmed) return;


    if (
        recipe.photos &&
        recipe.photos.length
    ) {

        const paths =
            recipe.photos.map(
                photo =>
                    photo.storage_path
            );


        await supabaseClient
        .storage
        .from("recipe-photos")
        .remove(paths);
    }


    const {
        error
    } =
        await supabaseClient
        .from("recipes")
        .delete()
        .eq(
            "id",
            editingRecipeId
        );


    if (error) {

        alert(
            error.message
        );

        return;
    }


    closeEditModal();

    await loadRecipes();
}


/* =====================================================
   CLOSE MODALS
===================================================== */

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).classList.remove(
        "visible"
    );
}


function closeDetailModal() {

    document.getElementById(
        "detailModal"
    ).classList.remove(
        "visible"
    );
}


/* =====================================================
   REALTIME
===================================================== */

function setupRealtime() {

    if (!currentSpace) return;


    supabaseClient
    .channel(
        "recipe-book-live"
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "recipes",
            filter:
                "space_id=eq."
                +
                currentSpace
        },
        async function() {

            await loadRecipes();

        }
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "recipe_photos",
            filter:
                "space_id=eq."
                +
                currentSpace
        },
        async function() {

            await loadRecipes();

        }
    )

    .subscribe();
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}


/* =====================================================
   START
===================================================== */

checkSession();
